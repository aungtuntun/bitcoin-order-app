name: "sast-scan"

on:
  push:
    branches: [githubcicd]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: |
          npm ci --force

      - name: OWASP Dependency Check
        run: |
          wget https://github.com/dependency-check/DependencyCheck/releases/download/v12.1.0/dependency-check-12.1.0-release.zip
          unzip dependency-check-12.1.0-release.zip

      - name: Run scan with ODC
        #timeout-minutes: 5
        run: |
          dependency-check/bin/dependency-check.sh --project "bitcoin" --scan package-lock.json --exclude node_modules --exclude .git --failOnCVSS 9 > ODC-report

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast report
          path: |
            ./ODC-report

